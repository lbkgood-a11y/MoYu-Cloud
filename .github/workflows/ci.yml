name: MoYu-Cloud CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 编译并执行后端测试
        run: mvn -f backend/pom.xml verify
      - name: 执行真实 MySQL 集成测试
        run: mvn -f backend/pom.xml verify
        env:
          RUN_MYSQL_TESTS: 'true'
      - name: 构建后端镜像
        run: docker build -t moyu-cloud-backend:${{ github.sha }} backend
      - name: 镜像漏洞扫描
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: moyu-cloud-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
