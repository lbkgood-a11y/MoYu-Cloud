spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:moyu;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
moyu:
  jwt:
    secret: test-secret-that-is-at-least-32-characters-long
