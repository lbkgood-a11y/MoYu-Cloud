services:
  mysql:
    image: mysql:8.4
    container_name: moyu-cloud-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: moyu_cloud
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - moyu-mysql-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    container_name: moyu-cloud-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MOYU_DB_URL: jdbc:mysql://mysql:3306/moyu_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      MOYU_DB_USERNAME: root
      MOYU_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      MOYU_JWT_SECRET: ${MOYU_JWT_SECRET:?请设置 MOYU_JWT_SECRET}
      MOYU_ADMIN_USERNAME: ${MOYU_ADMIN_USERNAME:?请设置 MOYU_ADMIN_USERNAME}
      MOYU_ADMIN_PASSWORD: ${MOYU_ADMIN_PASSWORD:?请设置 MOYU_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  moyu-mysql-data:
